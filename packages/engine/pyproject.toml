[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttrace"
version = "0.1.0"
description = "AgentTrace — Chrome DevTools for AI Agents. Trace, visualize, and debug agent decisions."
requires-python = ">=3.11"
dependencies = [
    "agenttrace-sdk",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0"]

[project.scripts]
agenttrace = "agenttrace_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agenttrace_engine"]
